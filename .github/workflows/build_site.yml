
name: Build GUI and deploy it

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x] # Updated to 18 (16 is End-of-Life)
    
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Restore yarn cache
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-v2-${{ hashFiles('**/yarn.lock') }}
        
      - name: Install modules
        run: |
          sudo apt install python3
          yarn cache clean --all
          yarn install --force --ignore-engines --no-lockfile

          chmod +x build-scratch-blocks.sh
          ./build-scratch-blocks.sh

      - name: Build Scratch-GUI
        run: |
          yarn run build

      - name: Deploy to Deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The folder containing your built website files
          branch: deploy        # The branch you want to push to