name: Build GUI and deploy it

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x] # Updated to 18 (16 is End-of-Life)

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          # Increment the version suffix here (e.g., from -v1 to -v2) to discard the corrupted cache
          key: ${{ runner.os }}-yarn-v2-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-v2-

      - name: Install and Build Frontend
        run: |
          
          sudo apt install python3
          yarn cache clean --all
          yarn install --force --ignore-engines --no-lockfile
          yarn run build

      - name: Deploy to Deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The folder containing your built website files
          branch: deploy        # The branch you want to push to